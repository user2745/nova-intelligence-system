version: '3.8'

services:
  nova-brain:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nova-intelligence-system
    ports:
      - "8000:8000"  # Nova HTTP API
      - "5000:5000"  # Piper TTS (if running separately)
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
    volumes:
      - ./audio_outputs:/app/audio_outputs
      - ./logs:/app/logs
    # Use host network to access local Ollama and monitor actual system network
    network_mode: "host"
    # ports:  # Ports are ignored when using host network mode
    #   - "8000:8000"
    #   - "5000:5000"
    env_file:
      - .env
    restart: unless-stopped
    # networks: # Incompatible with network_mode: host
    #   - nova-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

