version: '3.8'

services:
  nova-brain:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nova-intelligence-system
    ports:
      - "8000:8000"  # Nova HTTP API
      - "5000:5000"  # Piper TTS (if running separately)
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    volumes:
      - ./audio_outputs:/app/audio_outputs
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - nova-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Redis for caching (if you want to add it later)
  # redis:
  #   image: redis:7-alpine
  #   container_name: nova-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - nova-network
  #   restart: unless-stopped

networks:
  nova-network:
    driver: bridge

